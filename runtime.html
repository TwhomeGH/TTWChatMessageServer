<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運行狀態</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="app-ui bg-gray-900 text-gray-200 min-h-screen p-4"><main class="max-w-4xl mx-auto">
<nav class="flex flex-wrap gap-4 mb-6"><a href="/">主控台／日誌</a><a href="/config">啟動設定</a><a href="/browser">專用瀏覽器</a></nav>
<h1 class="text-2xl font-bold mb-4">運行狀態</h1>
<section class="bg-gray-800 rounded-lg p-6"><h2 id="state" class="text-xl font-bold" role="status">正在確認程序狀態…</h2><p id="description" class="my-4">正在讀取主服務資料</p>
<dl class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><dt>程序</dt><dd>TikTok.js</dd></div><div><dt>PID</dt><dd id="pid">—</dd></div><div><dt>啟用平台</dt><dd id="platforms">—</dd></div><div><dt>運行時間</dt><dd id="uptime">—</dd></div><div><dt>開始時間</dt><dd id="started">—</dd></div><div><dt>退出結果</dt><dd id="exit">—</dd></div></dl>
<p id="error" class="text-red-400 mt-4" role="alert"></p><p id="updated" class="text-gray-400 text-sm mt-4"></p>
<div class="flex flex-wrap gap-4 mt-6"><a href="/config" class="bg-blue-600 rounded-lg px-4 py-2">設定並啟動</a><form action="/close" method="post"><button id="stop" disabled class="bg-red-700 rounded-lg px-4 py-2 disabled:opacity-50">停止程序</button></form><button id="refresh" class="bg-gray-700 rounded-lg px-4 py-2">重新檢查</button></div></section>
<p class="text-gray-400 mt-4">此處顯示程序生命週期。各平台登入、直播連線與收訊情況請查看日誌；瀏覽器狀態請到專用瀏覽器頁。</p></main>
<script>
// 啟停結果仍留在本頁；改成唯讀網址，避免重新整理重送 /open 或 /close。
if (location.pathname !== '/runtime') history.replaceState(null, '', '/runtime');
const labels = { stopped: '已停止', starting: '啟動中', running: '程序執行中', stopping: '停止中', failed: '啟動失敗／異常退出' };
const descriptions = { stopped: '目前沒有執行中的聊天程序，可至啟動設定選擇平台。', starting: '主服務已接受啟動要求，正在等待程序建立。', running: '程序已建立；平台連線及初始化仍以日誌為準。', stopping: '已送出停止要求，正在等待程序完成清理。', failed: '程序未能正常啟動或已異常退出，請查看日誌確認原因。' };
let loading = false;
async function refresh() {
    if (loading) return;
    loading = true;
    try {
        const response = await fetch('/api/runtime', {cache:'no-store'});
        if (!response.ok) throw Error('狀態查詢失敗：' + response.status);
        const state = await response.json();
        document.getElementById('state').textContent = labels[state.state] || '未知狀態';
        document.getElementById('description').textContent = state.stopDelayed ? '停止等待已超過 15 秒，程序尚未退出，請查看日誌。' : descriptions[state.state];
        document.getElementById('pid').textContent = state.pid ?? '—';
        document.getElementById('platforms').textContent = state.platforms.join('、') || '未指定';
        document.getElementById('uptime').textContent = Math.floor(state.uptimeMs / 1000) + ' 秒';
        document.getElementById('started').textContent = state.startedAt === null ? '—' : new Date(state.startedAt).toLocaleString();
        document.getElementById('exit').textContent = state.stoppedAt === null ? '—' : 'code=' + state.exitCode + (state.signal ? ' / ' + state.signal : '');
        document.getElementById('error').textContent = state.error || '';
        document.getElementById('stop').disabled = !['running','starting'].includes(state.state);
        document.getElementById('updated').textContent = '更新於 ' + new Date().toLocaleTimeString();
    } catch (error) {
        document.getElementById('state').textContent = '無法確認運行狀態';
        document.getElementById('error').textContent = error.message + '，主服務可能已停止。';
        document.getElementById('stop').disabled = true;
    } finally { loading = false; }
}
document.getElementById('refresh').onclick = refresh;
document.querySelector('form').onsubmit = () => { document.getElementById('stop').disabled = true; };
setInterval(refresh, 2000);
refresh();
</script></body></html>
