<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>Config Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div id="safetyOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70">
      <div class="bg-white rounded-2xl shadow-2xl p-10 max-w-lg mx-4 text-center">
        <div class="text-6xl mb-4">⚠️</div>
        <h2 class="text-2xl font-bold text-gray-800 mb-4">安全確認</h2>
        <p class="text-lg text-gray-600 mb-2">請確認你已在安全環境，</p>
        <p class="text-lg text-red-600 font-semibold mb-8">未處於直播畫面放送中</p>
        <button onclick="confirmSafety()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-lg transition text-lg">
          確認，顯示內容
        </button>
      </div>
    </div>
    <div id="configContent" class="hidden">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-md md:max-w-3xl">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
        修改環境變數
      </h2>

      <form method="POST" action="/config" class="space-y-6">
        <div>
          <label for="BARK_API" class="block text-gray-700 mb-2"
            >BARK_API:</label
          >
          <input
            type="text"
            name="BARK_API"
            id="BARK_API"
            value="${BARK_API}"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="SOCKET_API" class="block text-gray-700 mb-2"
            >SOCKET_API:</label
          >
          <input
            type="text"
            name="SOCKET_API"
            id="SOCKET_API"
            value="${SOCKET_API}"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="BING_TRANSLATE_API_KEY" class="block text-gray-700 mb-2"
            >BING_TRANSLATE_API_KEY (選填，Microsoft 翻譯備援):</label
          >
          <input
            type="text"
            name="BING_TRANSLATE_API_KEY"
            id="BING_TRANSLATE_API_KEY"
            value="${BING_TRANSLATE_API_KEY}"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <hr class="my-6 border-gray-300" />
        <h3 class="text-xl font-bold text-gray-800 mb-4">Kick 設定</h3>

        <div>
          <label for="KICK_CLIENT_ID" class="block text-gray-700 mb-2"
            >KICK_CLIENT_ID:</label
          >
          <input
            type="text"
            name="KICK_CLIENT_ID"
            id="KICK_CLIENT_ID"
            value="${KICK_CLIENT_ID}"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="KICK_CLIENT_SECRET" class="block text-gray-700 mb-2"
            >KICK_CLIENT_SECRET:</label
          >
          <input
            type="text"
            name="KICK_CLIENT_SECRET"
            id="KICK_CLIENT_SECRET"
            value="${KICK_CLIENT_SECRET}"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="KICK_USER_NAME" class="block text-gray-700 mb-2"
            >KICK_USER_NAME (頻道名稱):</label
          >
          <input
            type="text"
            name="KICK_USER_NAME"
            id="KICK_USER_NAME"
            value="${KICK_USER_NAME}"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="mt-4">
          <a href="/kick-login"
            class="inline-block w-full text-center bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition font-bold">
            🔑 Kick OAuth 登入（取得頭像）
          </a>
        </div>

        <hr class="my-6 border-gray-300" />
        <h3 class="text-xl font-bold text-gray-800 mb-4">Twitch 自動剪輯 (AutoClip)</h3>
        <p class="text-sm text-gray-500 mb-4">
          以頻道自己的近期平均為基準，當觀眾數與聊天訊息速率相對平常出現高峰時自動建立剪輯。
          score = W_觀眾·(觀眾/基準) + W_訊息·(訊息速率/基準)，超過門檻即觸發。
        </p>

        <div>
          <label for="AUTO_CLIP_ENABLED" class="block text-gray-700 mb-2"
            >AUTO_CLIP_ENABLED (需同時啟用 Twitch 聊天室才生效):</label
          >
          <select
            name="AUTO_CLIP_ENABLED"
            id="AUTO_CLIP_ENABLED"
            data-value="${AUTO_CLIP_ENABLED}"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            <option value="0">停用</option>
            <option value="1">啟用</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4">
          <div>
            <label for="AUTO_CLIP_W_VIEWERS" class="block text-gray-700 mb-2"
              >W_VIEWERS 觀眾權重:</label
            >
            <input
              type="number"
              step="0.1"
              name="AUTO_CLIP_W_VIEWERS"
              id="AUTO_CLIP_W_VIEWERS"
              value="${AUTO_CLIP_W_VIEWERS}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_W_MSG" class="block text-gray-700 mb-2"
              >W_MSG 訊息權重:</label
            >
            <input
              type="number"
              step="0.1"
              name="AUTO_CLIP_W_MSG"
              id="AUTO_CLIP_W_MSG"
              value="${AUTO_CLIP_W_MSG}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_SCORE_THRESHOLD" class="block text-gray-700 mb-2"
              >SCORE_THRESHOLD 觸發門檻:</label
            >
            <input
              type="number"
              step="0.1"
              name="AUTO_CLIP_SCORE_THRESHOLD"
              id="AUTO_CLIP_SCORE_THRESHOLD"
              value="${AUTO_CLIP_SCORE_THRESHOLD}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_COOLDOWN_MIN" class="block text-gray-700 mb-2"
              >COOLDOWN_MIN 冷卻(分鐘):</label
            >
            <input
              type="number"
              min="1"
              name="AUTO_CLIP_COOLDOWN_MIN"
              id="AUTO_CLIP_COOLDOWN_MIN"
              value="${AUTO_CLIP_COOLDOWN_MIN}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_BASELINE_WINDOW_MIN" class="block text-gray-700 mb-2"
              >BASELINE_WINDOW_MIN 基準統計窗口(分鐘):</label
            >
            <input
              type="number"
              min="5"
              name="AUTO_CLIP_BASELINE_WINDOW_MIN"
              id="AUTO_CLIP_BASELINE_WINDOW_MIN"
              value="${AUTO_CLIP_BASELINE_WINDOW_MIN}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_RATE_WINDOW_MIN" class="block text-gray-700 mb-2"
              >RATE_WINDOW_MIN 即時速率窗口(分鐘):</label
            >
            <input
              type="number"
              min="1"
              name="AUTO_CLIP_RATE_WINDOW_MIN"
              id="AUTO_CLIP_RATE_WINDOW_MIN"
              value="${AUTO_CLIP_RATE_WINDOW_MIN}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_FLOOR_VIEWERS" class="block text-gray-700 mb-2"
              >FLOOR_VIEWERS 最低觀眾(少於此不觸發):</label
            >
            <input
              type="number"
              min="1"
              name="AUTO_CLIP_FLOOR_VIEWERS"
              id="AUTO_CLIP_FLOOR_VIEWERS"
              value="${AUTO_CLIP_FLOOR_VIEWERS}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_FLOOR_MSG_PER_MIN" class="block text-gray-700 mb-2"
              >FLOOR_MSG_PER_MIN 最低訊息速率:</label
            >
            <input
              type="number"
              step="0.1"
              name="AUTO_CLIP_FLOOR_MSG_PER_MIN"
              id="AUTO_CLIP_FLOOR_MSG_PER_MIN"
              value="${AUTO_CLIP_FLOOR_MSG_PER_MIN}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_SUSTAIN_MIN" class="block text-gray-700 mb-2"
              >SUSTAIN_MIN 持續達標時間(分鐘，分數在門檻上維持此時間才觸發):</label
            >
            <input
              type="number"
              step="0.5"
              min="0"
              name="AUTO_CLIP_SUSTAIN_MIN"
              id="AUTO_CLIP_SUSTAIN_MIN"
              value="${AUTO_CLIP_SUSTAIN_MIN}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_INSTANT_MULTIPLIER" class="block text-gray-700 mb-2"
              >INSTANT_MULTIPLIER 即時觸發倍率(分數達 門檻×此值 立即觸發，不需持續等待):</label
            >
            <input
              type="number"
              step="0.5"
              min="1"
              name="AUTO_CLIP_INSTANT_MULTIPLIER"
              id="AUTO_CLIP_INSTANT_MULTIPLIER"
              value="${AUTO_CLIP_INSTANT_MULTIPLIER}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div>
            <label for="AUTO_CLIP_DEDUP_SEC" class="block text-gray-700 mb-2"
              >DEDUP_SEC 訊息去重秒數(相同訊息在 N 秒內重複出現只算一次，防斷線重發/洗頻):</label
            >
            <input
              type="number"
              step="1"
              min="0"
              name="AUTO_CLIP_DEDUP_SEC"
              id="AUTO_CLIP_DEDUP_SEC"
              value="${AUTO_CLIP_DEDUP_SEC}"
              class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>

        <div class="mt-4">
          <label for="AUTO_CLIP_TITLE_PREFIX" class="block text-gray-700 mb-2"
            >AUTO_CLIP_TITLE_PREFIX (剪輯標題前綴，留空則使用直播標題):</label
          >
          <input
            type="text"
            name="AUTO_CLIP_TITLE_PREFIX"
            id="AUTO_CLIP_TITLE_PREFIX"
            value="${AUTO_CLIP_TITLE_PREFIX}"
            placeholder="例如：人氣高峰"
            class="w-full px-4 py-3 text-lg border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <hr class="my-6 border-gray-300" />
        <h3 class="text-xl font-bold text-gray-800 mb-4">平台 OAuth 重新授權</h3>

        <div class="mt-4">
          <a href="/twitch-auth"
            class="inline-block w-full text-center bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition font-bold">
            🔄 Twitch OAuth 重新授權（補齊 scope）
          </a>
        </div>

        <div class="mt-4">
          <a href="/youtube-auth"
            class="inline-block w-full text-center bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition font-bold">
            🎬 Youtube OAuth 重新授權
          </a>
        </div>

        <div class="flex space-x-4 mt-4">
          <button
            type="submit"
            class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
          >
            儲存
          </button>
          <button
            type="button"
            onclick="logout()"
            class="flex-1 bg-gray-400 text-white py-2 rounded-lg hover:bg-gray-500 transition"
          >
            登出
          </button>
          <button
            type="button"
            onclick="back_home()"
            class="flex-1 bg-gray-400 text-white py-2 rounded-lg hover:bg-gray-500 transition"
          >
            回主頁
          </button>
        </div>
      </form>
    </div>
    </div>

    <script>
        function confirmSafety() {
            document.getElementById('safetyOverlay').classList.add('hidden');
            document.getElementById('configContent').classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const sel = document.getElementById('AUTO_CLIP_ENABLED');
            if (sel) sel.value = sel.dataset.value || '0';
        });

        async function logout() {
            try {
            await fetch("/logout", { method: "GET", credentials: "include" });
            // 清除後端 Cookie 後，導回登入頁
            window.location.href = "/config";
            } catch (err) {
            console.error(err);
            alert("登出失敗");
            }
        }

        async function back_home() {
            window.location.href = "/";
        }

    </script>
  </body>
</html>
