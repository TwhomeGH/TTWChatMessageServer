<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restream 指標</title>
    <style>
        :root { color-scheme: dark; --bg: #0f172a; --panel: #111827; --line: #334155; --muted: #94a3b8; --text: #e5e7eb; --good: #4ade80; --warn: #fbbf24; --bad: #f87171; --blue: #60a5fa; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
        main { max-width: 1180px; margin: 0 auto; }
        a { color: #93c5fd; }
        .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
        h1 { margin: 0; font-size: 22px; }
        .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
        .top-nav { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; }
        .top-nav a { display: inline-block; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); text-decoration: none; }
        .top-nav a:hover { border-color: var(--blue); }
        .top-nav a.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
        .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
        #status { color: var(--muted); min-height: 1.5em; font-size: 13px; }
        #status.bad { color: var(--bad); }
        #refresh { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); cursor: pointer; }
        #refresh:hover { border-color: var(--blue); }
        .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
        table { width: 100%; min-width: 780px; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
        th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
        td { font-size: 13px; white-space: nowrap; }
        tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: rgba(96, 165, 250, .06); }
        tbody tr.stale { background: rgba(251, 191, 36, .06); }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .show-id { white-space: normal; overflow-wrap: anywhere; font-size: 12px; color: #cbd5e1; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #1e293b; font-size: 12px; }
        .good { color: var(--good); }
        .warn { color: var(--warn); }
        .bad { color: var(--bad); }
        .muted { color: var(--muted); }
        .empty { padding: 32px; text-align: center; color: var(--muted); }
        @media (max-width: 640px) {
            body { padding: 12px; }
            .topbar { flex-direction: column; }
        }
    </style>
</head>
<body>
<main>
    <header class="topbar">
        <div>
            <h1>Restream 指標</h1>
            <p class="subtitle">Health、Resolution、Bitrate、Frame rate、Keyframe interval；每 5 秒更新。</p>
        </div>
        <nav class="top-nav" aria-label="頁面導覽">
            <a href="/">主控台</a>
            <a href="/runtime">運行狀態</a>
            <a href="/traffic">人流分析</a>
            <a href="/monitor">直播訊息</a>
            <a href="/restream" class="active" aria-current="page">Restream 指標</a>
        </nav>
    </header>
    <div class="status-row">
        <p id="status" role="status"></p>
        <button id="refresh" type="button">↻ 重新整理</button>
    </div>
    <div class="table-wrap">
        <table>
            <colgroup>
                <col style="width:25%"><col style="width:8%"><col style="width:12%"><col style="width:11%">
                <col style="width:7%"><col style="width:10%"><col style="width:9%"><col style="width:9%"><col style="width:9%">
            </colgroup>
            <thead>
                <tr>
                    <th>場次</th><th>Health</th><th>解析度</th><th>Bitrate</th><th>FPS</th><th>Keyframe</th>
                    <th>擷取時間</th><th>收到時間</th><th>樣本</th>
                </tr>
            </thead>
            <tbody id="rows"><tr><td colspan="9" class="empty">載入中…</td></tr></tbody>
        </table>
    </div>
</main>
<script>
const rows = document.getElementById('rows');
const status = document.getElementById('status');
const refresh = document.getElementById('refresh');
let loading = false;
const fmtTime = value => value ? new Date(value).toLocaleTimeString() : '—';
const fmtAge = value => {
    if (!value) return '—';
    const seconds = Math.max(0, Math.round((Date.now() - value) / 1000));
    return seconds < 60 ? seconds + ' 秒前' : Math.floor(seconds / 60) + ' 分前';
};
const fmtBitrate = value => {
    if (value == null) return '—';
    return value >= 1000 ? (value / 1000).toFixed(1) + ' Mbps' : value + ' Kbps';
};
const healthClass = (value, stale) => {
    if (!value) return 'muted';
    if (stale) return 'warn';
    const text = String(value).toLowerCase();
    if (text.includes('poor') || text.includes('bad')) return 'bad';
    if (text.includes('fair') || text.includes('warn')) return 'warn';
    return 'good';
};
const cell = (text, className = '') => {
    const td = document.createElement('td');
    td.textContent = text;
    if (className) td.className = className;
    return td;
};
function healthCell(value, stale) {
    const td = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = 'badge ' + healthClass(value, stale);
    badge.textContent = value ?? '—';
    td.append(badge);
    return td;
}
function render(shows) {
    rows.replaceChildren();
    if (!shows.length) {
        const tr = document.createElement('tr');
        const td = cell('尚無 Restream 指標。請確認 Restream 助手已送出，且頁面在 show 頁。', 'empty');
        td.colSpan = 9;
        tr.append(td);
        rows.append(tr);
        return;
    }
    for (const show of shows) {
        const latest = show.latest;
        const values = latest.values || {};
        const stale = Date.now() - latest.receivedAt > 30000;
        const tr = document.createElement('tr');
        if (stale) tr.className = 'stale';
        const showCell = cell(show.showId, 'mono show-id');
        showCell.title = show.showId;
        tr.append(showCell);
        tr.append(healthCell(values.health, stale));
        tr.append(cell(values.resolution ?? '—', 'mono'));
        tr.append(cell(fmtBitrate(values.bitrateKbps), 'mono'));
        tr.append(cell(values.fps == null ? '—' : values.fps + ' fps', 'mono'));
        tr.append(cell(values.keyframeSec == null ? '—' : values.keyframeSec + ' s', 'mono'));
        const captured = cell(fmtTime(latest.capturedAt));
        captured.title = latest.capturedAt ? fmtAge(latest.capturedAt) : '';
        tr.append(captured);
        const received = cell(fmtTime(latest.receivedAt));
        received.title = latest.receivedAt ? fmtAge(latest.receivedAt) : '';
        if (stale) { received.className = 'warn'; received.title = '超過 30 秒沒有更新'; }
        tr.append(received);
        tr.append(cell(String(show.sampleCount ?? 0), 'muted'));
        rows.append(tr);
    }
}
async function load() {
    if (loading) return;
    loading = true;
    refresh.disabled = true;
    try {
        const response = await fetch('/restream/metrics', { cache: 'no-store' });
        if (response.status === 401) { location.href = '/restream'; return; }
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || '查詢失敗');
        render(data.shows || []);
        status.className = '';
        status.textContent = '更新於 ' + new Date().toLocaleTimeString() + ' · ' + (data.shows?.length || 0) + ' 場';
    } catch (error) {
        status.textContent = '更新失敗：' + error.message;
        status.className = 'bad';
    } finally {
        loading = false;
        refresh.disabled = false;
    }
}
refresh.addEventListener('click', load);
load();
setInterval(load, 5000);
</script>
</body>
</html>
