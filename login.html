<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登入 · TTW Chat Message Server</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="app-ui login-page">
    <main class="login-card">
      <p class="config-eyebrow">TTW Chat Message Server</p>
      <h1>系統登入</h1>
      <p class="login-hint">輸入控制台密碼。登入狀態會保留在 HttpOnly cookie。</p>

      <form id="loginForm" class="space-y-4">
        <div class="login-field">
          <label for="password">密碼</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="請輸入密碼"
            autocomplete="current-password"
            autofocus
            class="config-input"
          />
        </div>
        <button type="submit" class="config-primary-button w-full">登入</button>
      </form>

      <p id="error" class="login-error" role="alert"></p>
    </main>

    <script>
      async function login() {
        const password = document.getElementById('password').value.trim();
        const errorBox = document.getElementById('error');
        errorBox.textContent = '';

        if (!password) {
          errorBox.textContent = '請輸入密碼';
          return;
        }

        try {
          const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password }),
            credentials: 'include'
          });

          if (!res.ok) {
            errorBox.textContent = '登入失敗，密碼錯誤';
            return;
          }

          const data = await res.json();
          if (data.success) {
            window.location.href = typeof REDIRECT_AFTER_LOGIN !== 'undefined' ? REDIRECT_AFTER_LOGIN : '/config';
          } else {
            errorBox.textContent = '登入失敗';
          }
        } catch (err) {
          console.error(err);
          errorBox.textContent = '登入過程發生錯誤';
        }
      }

      document.getElementById('loginForm').addEventListener('submit', event => {
        event.preventDefault();
        login();
      });
    </script>
  </body>
</html>
