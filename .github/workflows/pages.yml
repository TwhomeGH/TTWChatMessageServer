# 用 changelogkit 匯出唯讀靜態站，部署到 GitHub Pages。
# 需先在 repo Settings → Pages → Source 選「GitHub Actions」。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 開發索引要列 commits 與 diff，需要完整歷史

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install changelogkit
        run: python -m pip install changelogkit

      - name: Export static site
        run: changelogkit export _site --branch main

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stale Pages deployments
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const inProgress = new Set([
              'deployment_in_progress', 'syncing_files', 'finished_file_sync',
              'updating_pages', 'purging_cdn'
            ]);
            const { owner, repo } = context.repo;
            const shas = new Set();
            if (context.payload.before && !/^0+$/.test(context.payload.before)) {
              shas.add(context.payload.before);
            }
            try {
              const { data: commits } = await github.rest.repos.listCommits({
                owner, repo, sha: context.sha, per_page: 10
              });
              for (const commit of commits) shas.add(commit.sha);
            } catch (error) {
              core.info(`Could not list recent commits: ${error.status || error.message}`);
            }
            shas.delete(context.sha);
            for (const sha of shas) {
              try {
                const { data } = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                  { owner, repo, deployment_id: sha }
                );
                if (!inProgress.has(data.status)) continue;
                await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                  { owner, repo, deployment_id: sha }
                );
                core.info(`Cancelled stale Pages deployment ${sha} (${data.status}).`);
              } catch (error) {
                if (error.status !== 404) {
                  core.info(`Could not cancel ${sha}: ${error.status || error.message}`);
                }
              }
            }

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages 偶爾會排隊超過預設 10 分鐘；保留較長時間但避免無限等待。
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000
