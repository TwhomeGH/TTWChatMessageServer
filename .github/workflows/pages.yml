# 用 changelogkit 匯出唯讀靜態站，部署到 GitHub Pages。
# 需先在 repo Settings → Pages → Source 選「GitHub Actions」。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 開發索引要列 commits 與 diff，需要完整歷史

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install changelogkit
        run: python -m pip install changelogkit

      - name: Export static site
        run: changelogkit export _site --branch main

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel stale Pages deployments
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // deploy-pages 的 Pages 狀態 API 可能 404 或停在非 in-progress 狀態，
            // 但 Pages 後端仍保留 lock；改看 Actions 的 github-pages deployments。
            const { owner, repo } = context.repo;
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, environment: 'github-pages', per_page: 20
              });
              for (const deployment of deployments) {
                if (deployment.sha === context.sha) continue;
                try {
                  const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                    owner, repo, deployment_id: deployment.id, per_page: 1
                  });
                  const state = statuses[0]?.state;
                  if (!state || state === 'success' || state === 'inactive') {
                    core.info(`${deployment.sha}: ${state || 'no status'} - skip`);
                    continue;
                  }
                  await github.request(
                    'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                    { owner, repo, deployment_id: deployment.sha }
                  );
                  core.info(`${deployment.sha}: cancelled stale pages deployment (${state})`);
                } catch (error) {
                  core.info(`${deployment.sha}: cancel failed (${error.status || error.message})`);
                }
              }
            } catch (error) {
              core.info(`Could not list github-pages deployments: ${error.status || error.message}`);
            }

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages 上限是 600000ms（10 分鐘），設定更大會被 clamp。
          error_count: 20
          reporting_interval: 10000
