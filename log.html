<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="app-ui bg-gray-900 text-gray-200 font-mono min-h-screen p-4">

  <div class="bg-gray-800 rounded-lg shadow-lg console-panel w-full flex flex-col">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <h1 class="text-xl font-bold text-green-400">系統日誌 Console</h1>
      <nav class="flex gap-2 flex-wrap text-sm">
        <a href="/runtime" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg" data-i18n="nav.runtime">▶ 運行狀態</a>
        <a href="/browser" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg" data-i18n="nav.browser">🌐 專用瀏覽器</a>
        <a href="/emoji" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg" data-i18n="nav.emoji">😀 表情映射</a>
        <a href="/logViewer" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-600 transition" data-i18n="nav.logViewer">📋 日誌檔案</a>
        <a href="/config" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-600 transition" data-i18n="nav.config">⚙️ 設定</a>
        <a href="/sponsor" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-600 transition" data-i18n="nav.sponsor">📢 贊助廣告</a>
        <a href="/keyword" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-600 transition" data-i18n="nav.keyword">📊 關鍵字</a>
        <a href="/clips" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-600 transition" data-i18n="nav.clips">🎬 剪輯</a>
        <a href="/autoclip" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-600 transition" data-i18n="nav.autoclip">📈 剪輯分析</a>
        <a href="/pushdiag" class="bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-600 transition" data-i18n="nav.pushdiag">🔧 推流診斷</a>
      <label style="display:inline-flex;gap:8px;align-items:center"><span data-i18n="common.language">語言</span><select data-language-select style="background:#374151;color:#fff;border-radius:6px;padding:6px"><option value="zh-TW">繁體中文</option></select></label><a href="/traffic" class="bg-gray-700 rounded px-3 py-2">人流分析</a></nav>
    </div>
    
    <!-- 日誌區塊 -->
    <div class="bg-black rounded-lg p-4 flex-1 overflow-auto w-full">
      <pre id="log" 
            class="whitespace-pre-wrap break-words text-sm w-full overflow-x-auto">
      </pre>
    </div>
  </div>

  <script src="/assets/i18n.js"></script>
<script>
    const logEl = document.getElementById('log');
    const es = new EventSource('/status/stream');

    let DATE = new Date()

    logEl.textContent = `${DATE.toLocaleString()} 初始化日誌\n`
    es.onmessage = (e) => {
      logEl.textContent += e.data + '\n';
      // 自動滾到底
      logEl.parentElement.scrollTop = logEl.parentElement.scrollHeight;
    };
  </script>
</body>
</html>
